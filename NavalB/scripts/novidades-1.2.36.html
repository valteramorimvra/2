<section><h3>Novidades 1.2.36</h3><p class="cr-dev">Responsável pelo desenvolvimento do game: Valter Amorim</p><p><b>Reflexo dos navios na água:</b> o mar espelha o casco junto à linha d’água, com a faixa escura do reflexo ondulando com as ondas e mais forte nas vistas rasantes. <b>Brilho do sol</b> no mar mais suave e natural.</p></section>
