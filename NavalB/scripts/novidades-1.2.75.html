<section><h3>Novidades 1.2.75 — Frota, aeródromos e passe</h3><p>Aeródromo militar nos cantos opostos. Navios Guarani, Arara, Sucuri, Jaburu e Tucano. Nave Carcará. Doze aeronaves. Bazuca de porta. Tripulação no convés. Metal com reflexo. Cidades maiores. Passe de batalha. Som no limitador.</p></section>
